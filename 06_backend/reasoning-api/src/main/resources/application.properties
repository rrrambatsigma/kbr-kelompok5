spring.application.name=reasoning-api

server.port=${SERVER_PORT:8082}
# Bind ke loopback secara default; jangan expose reasoning API ke jaringan.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Lokasi file ontology. Override dengan env ONTOLOGY_FILE_PATH.
ontology.file-path=${ONTOLOGY_FILE_PATH:E:/kbr-kelompok5/04_ontology/ontology.ttl}

# Batas waktu precompute/klasifikasi Openllet saat load/reload.
ontology.reasoning-timeout-ms=${ONTOLOGY_REASONING_TIMEOUT_MS:120000}

# false = aplikasi tetap hidup tanpa ontology (readiness DOWN).
# true  = startup gagal jika ontology tidak dapat dimuat.
ontology.fail-fast=${ONTOLOGY_FAIL_FAST:false}

logging.level.id.ac.uns.kbr.reasoning_api=INFO
