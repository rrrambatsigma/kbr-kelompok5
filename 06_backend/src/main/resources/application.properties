spring.application.name=kbr-backend
server.port=8081

# Lokasi file ontology Turtle.
# Bisa berupa path relatif, path absolut, atau diarahkan lewat environment variable.
ontology.file=../04_ontology/ontology.ttl

# Origin frontend yang diizinkan mengakses API.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Reasoning engine. Saat ini hanya "noop" yang tersedia.
# Adapter OWLAPI/HermiT dapat didaftarkan pada milestone integrasi reasoning.
reasoning.engine=noop
reasoning.timeout-ms=3000
