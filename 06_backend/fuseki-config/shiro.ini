# Fuseki untuk KBR Kelompok 5 berjalan di localhost dan READ-ONLY.
# File ini tidak berisi kredensial default. Jika Fuseki diekspos ke jaringan,
# aktifkan autentikasi yang kuat sebelum mengubah aturan di bawah.

[main]
ssl.enabled = false

plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
localhostFilter = org.apache.jena.fuseki.authz.LocalhostFilter

[users]
# Tidak ada user default. Tambahkan user admin yang kuat hanya jika diperlukan.

[roles]

[urls]
## Control functions hanya dari localhost.
/$/server  = localhostFilter
/$/ping    = localhostFilter
/$/metrics = localhostFilter

## Sisanya juga localhost. Server tetap dijalankan dengan --localhost.
/$/** = localhostFilter

## Endpoint data mengikuti aturan localhost di atas.
/** = localhostFilter
